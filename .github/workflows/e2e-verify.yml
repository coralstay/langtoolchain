name: E2E verify (real macOS, arm64 + Intel)

# End-to-end verification of the installer/uninstaller on real, clean,
# ephemeral GitHub-hosted macOS runners. Covers scenarios the project's
# backlog could only mark as "needs real hardware": TASK-6, 9-12, 18, 20,
# 23, 31, 32, 34, 35, 42-46. Every job checks out this exact commit so it
# always tests what's on the branch, not a stale published copy.
#
# TASK-85: runs automatically on push/PR to main, but only when something
# that could actually change installer behavior is touched (the `paths`
# filter below) - each full-cycle job does a real Homebrew/asdf
# install+uninstall, so this is minutes-to-tens-of-minutes per run, not
# worth firing on every README/backlog-only commit. `workflow_dispatch`
# still works for an on-demand run regardless of what changed.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: &e2e-relevant-paths
      - "scripts/**"
      - "install.sh"
      - "uninstall.sh"
      - ".tool-versions"
      - ".github/workflows/e2e-verify.yml"
  pull_request:
    branches: [main]
    paths: *e2e-relevant-paths

jobs:
  lint-hardcoded-paths:
    # TASK-125.3 (decision-1): fast, cheap static check for the
    # "hardcoded path/env-var instead of the shared lib.sh helper"
    # regression class (TASK-57/61/65/70). No real Homebrew/asdf install
    # needed, so this runs on a plain ubuntu-latest runner and fails in
    # seconds, well before the expensive real-macOS jobs below even start.
    name: hardcoded path/env-var lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/lint/check-hardcoded-paths.sh

  full-cycle:
    name: full install -> uninstall cycle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            label: arm64
          - runner: macos-15-intel
            label: intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: sanity - confirm actual architecture (TASK-34/35)
        run: |
          echo "uname -m: $(uname -m)"
          echo "sw_vers:"; sw_vers
          test "$(uname -m)" = "${{ matrix.label == 'intel' && 'x86_64' || 'arm64' }}"

      - name: run installer for real (TASK-6, 9-12, 42-45)
        run: sh scripts/install/main.sh --all --yes

      - name: verify each shim wins in a real new login shell (TASK-18)
        run: |
          # Use $SHELL, not a hardcoded zsh - detect_rc_file() in lib.sh
          # wrote to whichever rc file matches *this account's actual*
          # $SHELL, and a differently-shelled login (e.g. forcing zsh when
          # $SHELL=bash) would read the wrong rc file entirely and always
          # "fail" for a reason that has nothing to do with PATH priority.
          echo "SHELL=$SHELL"
          for cmd in node java python rustc go; do
            resolved="$("$SHELL" -lic "command -v $cmd" 2>/dev/null || true)"
            echo "$cmd -> $resolved"
            case "$resolved" in
              *"/.asdf/shims/"*) echo "  OK" ;;
              *) echo "  FAIL: $cmd did not resolve through an asdf shim in a real login shell"; exit 1 ;;
            esac
          done

      - name: run uninstaller for real (TASK-23, 46)
        run: sh scripts/uninstall/main.sh --yes

      - name: verify teardown is clean in a real new login shell
        run: |
          # Same $SHELL reasoning as the shim-priority check above.
          "$SHELL" -lic '
            command -v asdf >/dev/null 2>&1 && { echo "FAIL: asdf still resolvable"; exit 1; }
            case ":$PATH:" in
              *".asdf/shims:"*) echo "FAIL: asdf shims still on PATH"; exit 1 ;;
            esac
            echo "OK: teardown confirmed clean in a real new shell"
          '

  no-homebrew-bootstrap:
    name: install with Homebrew pre-removed (TASK-20)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: remove Homebrew entirely first
        run: |
          if command -v brew >/dev/null 2>&1; then
            NONINTERACTIVE=1 /bin/bash -c \
              "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh)"
          fi
          command -v brew >/dev/null 2>&1 && { echo "FAIL: brew still present"; exit 1; } || true

      - name: run installer - must self-bootstrap Homebrew
        run: sh scripts/install/main.sh --all --yes

  no-git-curl-pipe:
    name: curl | sh with git hidden (TASK-31)
    runs-on: macos-15
    steps:
      - name: run remote one-liner with git unreachable, expect graceful failure
        run: |
          # /usr/bin (where Xcode CLT's git lives) is the read-only signed
          # system volume - not even `sudo mv` can touch it. And dropping
          # the whole directory from PATH isn't an option either, since
          # curl/sh/mktemp/etc. live right alongside git in the same
          # directory. Instead: symlink every executable found on PATH
          # into a scratch dir, *except* anything literally named "git",
          # then use only that scratch dir as PATH.
          scratch="$(mktemp -d)"
          old_ifs="$IFS"
          IFS=:
          for dir in $PATH; do
            IFS="$old_ifs"
            [ -d "$dir" ] || continue
            for f in "$dir"/*; do
              [ -x "$f" ] || continue
              base="$(basename "$f")"
              [ "$base" = "git" ] && continue
              [ -e "$scratch/$base" ] && continue
              ln -s "$f" "$scratch/$base" 2>/dev/null || true
            done
          done
          IFS="$old_ifs"
          PATH="$scratch"
          export PATH
          command -v git >/dev/null 2>&1 && { echo "FAIL: git is still resolvable"; exit 1; }

          set +e
          curl -fsSL https://raw.githubusercontent.com/coralstay/langtoolchain/main/install.sh | sh > out.log 2>&1
          status=$?
          set -e

          cat out.log
          [ "$status" -ne 0 ] || { echo "FAIL: expected non-zero exit without git"; exit 1; }
          grep -q "git is required" out.log || { echo "FAIL: expected clear git-required error message"; exit 1; }
          echo "OK: failed gracefully with a clear error, as expected"

  interrupt-and-resume:
    name: kill mid-install then re-run (TASK-32)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: start install, kill it partway through phase 5, confirm partial state doesn't wedge a re-run
        run: |
          # macOS doesn't ship a `timeout` utility, so start in the
          # background and kill it ourselves after a delay instead.
          sh scripts/install/main.sh --all --yes > first-run.log 2>&1 &
          install_pid=$!
          sleep 90
          kill "$install_pid" 2>/dev/null || true
          # Give the process tree a moment to actually die before moving on.
          sleep 5
          echo "--- interrupted run log (last 20 lines) ---"
          tail -20 first-run.log

      - name: re-run to completion - must succeed despite the partial state left behind
        run: sh scripts/install/main.sh --all --yes

      - name: cleanup
        if: always()
        run: sh scripts/uninstall/main.sh --yes || true
